name: Release

on:
  push:
    tags:
      - "v*"
  # Allows re-running just the crates.io publish when a tag build published the
  # GitHub release and Homebrew tap but failed to publish the crate. Trusted
  # publishing is pinned to this workflow file, so it cannot live elsewhere.
  workflow_dispatch:
    inputs:
      crates-only:
        description: "Publish to crates.io only (skip GitHub release and tap)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.event_name == 'push' || !inputs.crates-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: release
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --token ${{ steps.crates-io-auth.outputs.token }}
